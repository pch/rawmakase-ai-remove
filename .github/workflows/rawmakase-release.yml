# Written by `cargo rawmakase release`, with cargo-rawmakase pinned to the
# RAWmakase commit the SDK is (it reads `api = 3` from there). On a tag v<version>, builds the
# extension on every platform RAWmakase releases for, packages it with
# `cargo rawmakase package` and attaches the packages to the tag's release,
# where RAWmakase's Install from GitHub finds them.
name: Release extension

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64 }
          - { os: macos-15, target: macos-aarch64 }
          - { os: macos-15-intel, target: macos-x86_64 }
          - { os: windows-2025, target: windows-x86_64 }
          - { os: windows-11-arm, target: windows-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install --locked --git https://github.com/pch/rawmakase --rev 35a7f24ded6690f81d8220e7dbdf50cee9ebf0ff cargo-rawmakase
      - run: cargo rawmakase build
      # Apple silicon runs only signed programs: an ad-hoc signature is enough
      # for a program RAWmakase downloads itself.
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          for program in target/release/*; do
            if [ -f "$program" ] && [ -x "$program" ]; then codesign --force --sign - "$program"; fi
          done
      - run: cargo rawmakase package --target ${{ matrix.target }}
      - name: Check Linux package compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: python3 scripts/check-linux-package.py target/rmext/*.rmext
      - uses: actions/upload-artifact@v4
        with:
          name: rmext-${{ matrix.target }}
          path: target/rmext/*.rmext
          if-no-files-found: error

  # One job publishes, once every package is built: the release never exists
  # with only some of them, and no two jobs race to create it.
  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rmext-*
          path: rmext
          merge-multiple: true
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls rmext
          test "$(ls rmext/*.rmext | wc -l)" -eq 6
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /dev/null --verify-tag
          gh release upload "$GITHUB_REF_NAME" rmext/*.rmext --clobber
