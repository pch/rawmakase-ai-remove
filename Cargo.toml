[package]
name = "rawmakase-ai-retouch"
version = "0.2.0"
edition = "2024"
description = "Experimental AI Remove and AI Replace for RAWmakase's Remove tool, through a hosted model and your own API key"
license = "MIT"
repository = "https://github.com/pch/rawmakase-ai-retouch"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rawmakase-ai-retouch"
path = "src/main.rs"

[dependencies]
# The SDK's API 3 (retouch generators, secret settings), pinned to the
# commit of pch/rawmakase#1093 that adds it, until it is in a release.
rawmakase-extension = { git = "https://github.com/pch/rawmakase", rev = "ee82e60b6e1c1230d07c86131e31968013876aad" }
serde_json = "1"
# Data URIs for the images sent to the providers and read back from them.
base64 = "0.22"
# Encoding the region and the mask as PNG, and decoding what a provider
# returns: PNG, JPEG or WebP.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Blocking HTTPS with rustls and its bundled roots: no OpenSSL, no system TLS.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Checking the downloaded model against its pinned hash.
sha2 = "0.10"

# AI Remove on this computer: LaMa through ONNX Runtime, with the runtime
# downloaded at build time (pyke's prebuilt binaries) and linked in. There is
# no binary for Intel Macs, which get a message instead.
[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }

[profile.release]
strip = true
