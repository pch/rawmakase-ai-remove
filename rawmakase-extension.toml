[extension]
id = "dev.pch.ai-remove"
name = "AI Retouch"
version = "0.3.0"
rawmakase = ">=0.5"
api = 3
authors = ["Piotr Chmolowski"]
license = "MIT"
repository = "https://github.com/pch/rawmakase-ai-retouch"
description = "Experimental: AI Remove and AI Replace in an AI Retouch tool, with a hosted AI model (fal.ai or Replicate) and your own API key. Paint over an area, optionally say what to do with it; each request sends the region to the service and is one paid call. Its AI Local Remove tab removes with a model that runs locally: nothing is uploaded, and no key is needed."

[access]
network = true

[program]
path = "bin/rawmakase-ai-retouch"
start = "on-demand"

[[setting]]
id = "provider"
name = "Service"
help = "Where AI Remove and AI Replace run. Each request is one paid call to it. No account yet? [Getting an API key](https://github.com/pch/rawmakase-ai-retouch/blob/main/docs/getting-a-key.md)"
control = { segmented = ["fal.ai", "Replicate"] }
default = "fal.ai"

[[setting]]
id = "fal-key"
name = "fal.ai API key"
help = "From fal.ai > Dashboard > Keys, with the API preset. [How to get one](https://github.com/pch/rawmakase-ai-retouch/blob/main/docs/getting-a-key.md#falai)"
control = "secret"
default = ""
visible-when = { setting = "provider", equals = "fal.ai" }

[[setting]]
id = "replicate-token"
name = "Replicate API token"
help = "From replicate.com > Account > API tokens. [How to get one](https://github.com/pch/rawmakase-ai-retouch/blob/main/docs/getting-a-key.md#replicate)"
control = "secret"
default = ""
visible-when = { setting = "provider", equals = "Replicate" }

[[setting]]
id = "replace-model"
name = "Replace model"
help = "What AI Replace uses: Nano Banana ($0.04 an image) edits what you paint as the prompt says; Bria GenFill ($0.04 a megapixel) or FLUX.1 Fill [pro] ($0.05 a megapixel) fill it with what you describe; Bria FIBO Edit ($0.04 an image) follows an instruction."
control = { choice = ["Nano Banana", "Bria GenFill", "FLUX.1 Fill [pro]", "Bria FIBO Edit"] }
default = "Nano Banana"
visible-when = { setting = "provider", equals = "fal.ai" }

[[setting]]
id = "replicate-model"
name = "Replicate model"
help = "What AI Remove uses without text: owner/name or owner/name:version of a model that takes an image and a mask. With text, and for AI Replace, bria/fibo-edit."
control = "text"
default = "bria/eraser"
visible-when = { setting = "provider", equals = "Replicate" }

# First, so the rail's tool is AI Retouch's, with its icon and name; each
# generator is a tab in its drawer.
[[retouch-generator]]
id = "retouch"
name = "AI Retouch"
uploads = true
panel = "retouch"
# Lucide's wand-sparkles (ISC), drawn white for RAWmakase to tint.
icon = "icons/retouch.svg"
description = "A hosted model (fal.ai or Replicate), with your own API key."

# AI Remove with a model that runs on this computer: nothing leaves it, so
# there is no `uploads` and no consent question, and nothing to choose, so no
# panel. The model is downloaded once, on first use.
[[retouch-generator]]
id = "local"
name = "AI Local Remove"
icon = "icons/local.svg"
description = "Runs on this computer: nothing is uploaded and no key is needed. The first use downloads the model (198 MB)."

# Remove or Replace, and the prompt: in the tool's drawer.
[[panel]]
id = "retouch"
title = "AI Retouch"
place = "generator"
